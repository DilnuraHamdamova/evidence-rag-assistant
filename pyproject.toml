[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-rag-assistant"
version = "0.1.0"
description = "Citation-first RAG assistant with offline retrieval and optional OpenAI generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.42,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
